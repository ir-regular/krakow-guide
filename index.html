<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kraków — a friend's guide</title>

  <!-- Leaflet: the map library. Loaded from a CDN, so there is nothing to install. -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- MapLibre GL + the leaflet binding: renders the OpenFreeMap vector basemap
       (see js/app.js). Everything else — markers, popups, district shapes —
       still uses plain Leaflet, so this is only for the base map layer. -->
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.1.3/leaflet-maplibre-gl.js"></script>

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="app">

  <!-- ── Sidebar ─────────────────────────────────────────────── -->
  <aside id="sidebar">
    <header id="sidebar-header">
      <button id="back-btn" type="button" hidden>&larr; <span id="back-label">Back</span></button>
      <h1 id="panel-title">Kraków</h1>
      <p id="panel-tagline"></p>
    </header>

    <div id="panel-body"><!-- filled by app.js --></div>

    <footer id="sidebar-footer">
      <span>Map data &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors</span>
    </footer>
  </aside>

  <!-- ── Map ─────────────────────────────────────────────────── -->
  <main id="map-wrap">
    <div id="map"></div>
    <div id="map-legend" hidden></div>
    <button id="mobile-toggle" type="button" aria-label="Toggle panel">Info</button>
  </main>

</div>

<!-- data.js holds ALL the content — this is the only file you need to edit. -->
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
